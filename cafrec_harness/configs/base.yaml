# Shared config for every model in the harness.
# Model-specific keys (loss_type, neg sampling, hidden sizes) come from the
# registry, so this file holds only what should be identical across models.

# --- reproducibility ---
seed: 2020
reproducibility: True

# --- atomic-file fields (ml-100k defaults; override per-dataset later) ---
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp
load_col:
  inter: [user_id, item_id, timestamp]

# --- sequential settings ---
MAX_ITEM_LIST_LENGTH: 50
embedding_size: 64

# --- evaluation: leave-one-out, time-ordered, FULL ranking ---
eval_args:
  split: {LS: valid_and_test}   # leave-one-out (last=test, 2nd-last=valid)
  order: TO                      # time order
  mode: full                     # rank the held-out target against the WHOLE catalogue
  group_by: user
metrics: [Recall, NDCG, MRR, Hit]   # Hit@10 == HR@10
topk: 10
valid_metric: NDCG@10
# NOTE (D2): mode was uni100 (1 pos + 99 uniform negatives). Full ranking removes
# the sampled-negative bias but INVALIDATES every uni100 baseline number — all
# baselines must be re-run under mode:full before they are comparable again.

# --- training (CPU-friendly sanity defaults) ---
epochs: 10
train_batch_size: 2048
eval_batch_size: 4096
stopping_step: 3

data_path: '../data/recbole'   # relative to cafrec_harness/ (run.py's dir)
# -> RecBole reads <data_path>/<dataset>/<dataset>.inter
#    e.g. ../data/recbole/kuairand_pure/kuairand_pure.inter
# NOTE: launch run.py from cafrec_harness/ so this resolves. Modal runs override
#       data_path to /data/recbole (the mounted volume), so this line is local-only.

# --- per-dataset workflow (D2) ----------------------------------------------
# The three KuaiRand tiers are SEPARATE, self-contained datasets, each with its
# own leave-one-out train/valid/test split above. There is no cross-tier split
# (the tiers have disjoint user/item id spaces). Roles:
#   kuairand_pure  -> fast dev / validation smoke  (184 MB; iterate here)
#   kuairand_1k    -> PRIMARY reported results
#   kuairand_27k   -> heavy-scale training run     (needs the heavy-tier item
#                     floor; 27k full-softmax CE over the full catalogue is
#                     GPU-heavy — see dataset builder MIN_ITEM_INTER/ k-core)
# Select the tier per run via run_experiment(..., dataset="kuairand_1k").